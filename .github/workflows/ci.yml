name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest

      - name: Validate marketplace, plugins and skills
        run: python scripts/validate.py

      - name: Scanner tests
        run: python -m pytest -q tests

      - name: Build zips
        run: python scripts/build_zips.py

      # writing-unslop's own docs quote the tells on purpose, so they are left out.
      - name: Scan our own docs for slop
        run: >
          python plugins/writing-unslop/skills/writing-unslop/scripts/slop_scan.py
          --fail-on high
          README.md
          plugins/interview/skills/interview/SKILL.md
          plugins/handoff/skills/handoff/SKILL.md
