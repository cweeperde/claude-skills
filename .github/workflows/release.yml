name: Release

# Push a tag named <plugin>-v<x.y.z> (e.g. interview-v1.1.0) to publish a
# GitHub Release for that plugin. The tag must match plugin.json and the newest
# dated CHANGELOG entry. Every release carries the zips of all skills as of
# that commit, so the release marked Latest always has the full set and
# releases/latest/download/<skill>.zip links keep working.
on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag against plugin.json and CHANGELOG
        run: python scripts/validate.py --tag "$GITHUB_REF_NAME"

      - name: Build zips and release notes
        run: |
          python scripts/build_zips.py
          python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          echo "TITLE=${GITHUB_REF_NAME%-v*} ${GITHUB_REF_NAME##*-v}" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "$TITLE"
          --notes-file notes.md
          dist/*.zip
